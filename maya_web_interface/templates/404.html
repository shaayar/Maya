<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - MAYA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4a90e2',
                        'primary-dark': '#357abd',
                    },
                    animation: {
                        'bounce-slow': 'bounce 3s infinite',
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-text {
            background: linear-gradient(90deg, #4a90e2, #6e5de7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .floating {
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex-shrink-0 flex items-center">
                        <span class="text-2xl font-bold text-primary">MAYA</span>
                    </a>
                </div>
                <div class="hidden md:ml-6 md:flex md:items-center space-x-4">
                    <a href="/app" class="text-gray-700 hover:text-primary px-3 py-2 text-sm font-medium">Go to App</a>
                    <a href="/" class="text-gray-700 hover:text-primary px-3 py-2 text-sm font-medium">Home</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 404 Content -->
    <main class="flex-grow flex items-center justify-center px-4 sm:px-6 lg:px-8">
        <div class="text-center max-w-3xl mx-auto py-16">
            <div class="floating inline-block mb-8">
                <div class="text-9xl font-bold text-gray-200">404</div>
            </div>
            <h1 class="text-4xl font-extrabold text-gray-900 sm:text-5xl sm:tracking-tight lg:text-6xl">
                Page not found
            </h1>
            <p class="mt-3 text-xl text-gray-500">
                Sorry, we couldn't find the page you're looking for.
            </p>
            <div class="mt-10 flex flex-col sm:flex-row justify-center gap-3">
                <a href="/" class="px-6 py-3 border border-transparent text-base font-medium rounded-md text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                    Go back home
                </a>
                <a href="/app" class="px-6 py-3 border border-transparent text-base font-medium rounded-md text-primary bg-primary/10 hover:bg-primary/20 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                    Launch App
                </a>
            </div>
            <div class="mt-10">
                <p class="text-sm text-gray-500">
                    Or try searching
                </p>
                <div class="mt-1 max-w-xs mx-auto">
                    <div class="relative rounded-md shadow-sm">
                        <input type="text" class="focus:ring-primary focus:border-primary block w-full pl-4 pr-12 py-3 border-gray-300 rounded-md" placeholder="Search...">
                        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                            <i class="fas fa-search text-gray-400"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200">
        <div class="max-w-7xl mx-auto py-6 px-4 overflow-hidden sm:px-6 lg:px-8">
            <p class="text-center text-base text-gray-500">
                &copy; 2025 MAYA AI. All rights reserved.
            </p>
        </div>
    </footer>

    <script>
        // Simple search functionality
        document.querySelector('input[type="text"]').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const query = this.value.trim();
                if (query) {
                    window.location.href = `/search?q=${encodeURIComponent(query)}`;
                }
            }
        });
    </script>
</body>
</html>
