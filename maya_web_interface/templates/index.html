<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAYA Web Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4a90e2',
                        'primary-dark': '#357abd',
                        'background-light': '#f5f7fa',
                        'background-dark': '#1e293b',
                        'text-primary': '#1e293b',
                        'text-secondary': '#64748b',
                        'border-color': '#e2e8f0',
                        'success': '#10b981',
                        'error': '#ef4444',
                        'warning': '#f59e0b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <div class="w-64 bg-white shadow-md flex flex-col">
            <div class="p-6 border-b border-gray-200">
                <h1 class="text-2xl font-bold text-primary">MAYA</h1>
            </div>
            <nav class="flex-1 p-4">
                <ul class="space-y-2">
                    <li class="nav-item active" data-section="chat">
                        <a href="/app#chat" class="block w-full h-full">
                            <i class="fas fa-comment w-5 text-center"></i>
                            <span>Chat</span>
                        </a>
                    </li>
                    <li class="nav-item" data-section="todo">
                        <a href="/app#todo" class="block w-full h-full">
                            <i class="fas fa-tasks w-5 text-center"></i>
                            <span>To-Do List</span>
                        </a>
                    </li>
                    <li class="nav-item" data-section="files">
                        <a href="/app#files" class="block w-full h-full">
                            <i class="fas fa-folder w-5 text-center"></i>
                            <span>Files</span>
                        </a>
                    </li>
                    <li class="nav-item" data-section="settings">
                        <a href="/app#settings" class="block w-full h-full">
                            <i class="fas fa-cog w-5 text-center"></i>
                            <span>Settings</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-8 overflow-auto">
            <!-- Chat Section -->
            <section id="chat-section" class="content-section">
                <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-sm h-full flex flex-col">
                    <!-- Chat Header -->
                    <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                        <h2 class="text-xl font-semibold text-gray-800">Chat with MAYA</h2>
                        <div class="flex space-x-2">
                            <button id="voice-toggle" class="p-2 rounded-full hover:bg-gray-100 text-gray-600 hover:text-primary transition-colors">
                                <i class="fas fa-microphone"></i>
                            </button>
                            <button id="clear-chat" class="p-2 rounded-full hover:bg-gray-100 text-gray-600 hover:text-red-500 transition-colors">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Chat Messages -->
                    <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4">
                        <!-- Messages will be inserted here by JavaScript -->
                    </div>
                    
                    <!-- Chat Input -->
                    <div class="p-4 border-t border-gray-200 bg-white">
                        <div class="flex items-end space-x-2 mb-2">
                            <div class="flex-1 relative">
                                <textarea 
                                    id="user-input" 
                                    placeholder="Type your message..."
                                    class="w-full p-3 pr-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent resize-none"
                                    rows="1"
                                ></textarea>
                                <button id="send-button" class="absolute right-3 bottom-3 p-1 text-gray-500 hover:text-primary transition-colors">
                                    <i class="fas fa-paper-plane text-xl"></i>
                                </button>
                            </div>
                            <div class="flex space-x-1">
                                <button class="p-2 text-gray-500 hover:text-primary rounded-full hover:bg-gray-100 transition-colors">
                                    <i class="fas fa-paperclip"></i>
                                </button>
                                <button class="p-2 text-gray-500 hover:text-primary rounded-full hover:bg-gray-100 transition-colors">
                                    <i class="fas fa-robot"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- To-Do Section -->
            <section id="todo-section" class="content-section hidden">
                <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-sm h-full flex flex-col">
                    <div class="p-6 border-b border-gray-200">
                        <div class="flex justify-between items-center">
                            <h2 class="text-2xl font-semibold text-gray-800">To-Do List</h2>
                            <button id="open-todo-modal" class="flex items-center space-x-2 bg-primary text-white px-4 py-2 rounded-lg hover:bg-primary-dark transition-colors">
                                <i class="fas fa-plus"></i>
                                <span>Add Task</span>
                            </button>
                        </div>
                    </div>
                    <div class="p-6 flex-1 overflow-y-auto">
                        <div id="todo-list" class="space-y-2">
                            <!-- To-do items will be added here by JavaScript -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- Files Section -->
            <section id="files-section" class="content-section hidden">
                <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-sm h-full flex flex-col">
                    <div class="p-6 border-b border-gray-200">
                        <h2 class="text-2xl font-semibold text-gray-800">File Explorer</h2>
                    </div>
                    <div class="p-6 flex-1 overflow-y-auto">
                        <div class="mb-6">
                            <label class="inline-block px-6 py-2 bg-primary text-white rounded-lg cursor-pointer hover:bg-primary-dark transition-colors">
                                <i class="fas fa-upload mr-2"></i>Upload File
                                <input type="file" id="file-upload" class="hidden">
                            </label>
                        </div>
                        <div id="file-list" class="border rounded-lg divide-y">
                            <div class="p-4 text-center text-gray-500">
                                No files uploaded yet
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Settings Section -->
            <section id="settings-section" class="content-section hidden">
                <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-sm h-full flex flex-col">
                    <div class="p-6 border-b border-gray-200">
                        <h2 class="text-2xl font-semibold text-gray-800">Settings</h2>
                    </div>
                    <div class="p-6 flex-1 overflow-y-auto space-y-6">
                        <div>
                            <h3 class="text-lg font-medium text-gray-900 mb-4">Appearance</h3>
                            <div class="space-y-3">
                                <div class="flex items-center">
                                    <input id="dark-mode" type="checkbox" class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                                    <label for="dark-mode" class="ml-2 text-sm text-gray-700">Dark Mode</label>
                                </div>
                            </div>
                        </div>
                        <div class="pt-4 border-t border-gray-200">
                            <h3 class="text-lg font-medium text-gray-900 mb-4">Account</h3>
                            <button class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
                                Sign Out
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- Todo Modal -->
    <div id="todo-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="text-lg font-semibold">Add New Task</h3>
                <button class="modal-close">&times;</button>
            </div>
            <form id="todo-form" class="todo-form">
                <div class="form-group">
                    <label for="task-title">Title</label>
                    <input type="text" id="task-title" required>
                </div>
                <div class="form-group">
                    <label for="task-description">Description</label>
                    <textarea id="task-description"></textarea>
                </div>
                <div class="form-group">
                    <label for="task-due-date">Due Date</label>
                    <input type="date" id="task-due-date">
                </div>
                <div class="form-group">
                    <label for="task-priority">Priority</label>
                    <select id="task-priority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary modal-close">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Task</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/animations.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
